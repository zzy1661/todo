name: build

# Tauri 桌面打包流水线（T-15 macOS / 本轮新增 Windows）。
#
# 说明：本文件是「可构建能力」的交付物，不在本机执行 —— macOS 无法交叉编译
# Windows 安装包（Tauri 无交叉编译支持），Windows 产物的唯一验证路径就是这里的
# `windows-latest` job。本机只验证了三份 conf 的合并结果与 workflow 结构
# （scripts/check-bundle-config.mjs），**不声称 CI 已通过**。
#
# 顺序固定为：npm ci → 前端构建 → E2E 6 用例 → tauri build → 上传安装包。
# E2E 在打包之前，任何回归都会拦在出包之前。

on:
  push:
    branches: [master, 'release/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64 · .app + .dmg)
            os: macos-latest
            artifact: todo-macos
            bundlePaths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - name: Windows (NSIS + MSI)
            os: windows-latest
            artifact: todo-windows
            bundlePaths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Secret guard (no hardcoded Supabase keys)
        run: npm run check:no-secrets

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium (unix)
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium (windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium

      - name: E2E baseline (must be 6 passed)
        run: npx playwright test

      # Windows job 必须真的出包，不是占位：tauri.windows.conf.json 由 Tauri
      # 按平台自动合并（targets: nsis + msi）。
      - name: Tauri build (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build

      - name: Tauri build (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundlePaths }}
          if-no-files-found: error
          retention-days: 14
